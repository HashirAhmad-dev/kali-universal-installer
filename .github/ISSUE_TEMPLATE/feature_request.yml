name: Feature request
description: Suggest a new package type or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: |
        If it is a new package type, include the exact command(s) that install it
        from the command line and whether they need root.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
