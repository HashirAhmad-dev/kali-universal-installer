name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0

      - name: Install PySide6
        run: python -m pip install --upgrade pip "PySide6>=6.7"

      - name: Unit tests (no Qt)
        run: |
          python tests/test_detector.py
          python tests/test_handlers.py
          python tests/test_outcome.py

      - name: Integration tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_integration.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev lintian

      - name: Build the .deb
        run: ./build-deb.sh

      - name: Lint the package
        run: lintian dist/kupi_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: kupi-deb
          path: dist/*.deb
          if-no-files-found: error
